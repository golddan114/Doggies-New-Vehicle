pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'doggiesnewvehicle-forge-1.20.1'
def minecraftLine = providers.gradleProperty('dnvMinecraft').getOrElse('1.20.1')
if (minecraftLine == '1.21.1') {
    rootProject.name = 'doggiesnewvehicle-neoforge-1.21.1'
    rootProject.buildFileName = 'build-neoforge.gradle'
} else if (minecraftLine != '1.20.1') {
    throw new GradleException("Unsupported DNV Minecraft line: ${minecraftLine}")
}
include 'route-core'
