// Development-only runtime mappings; production compilation and dependencies stay unchanged.
def apInputsDir = layout.buildDirectory.dir('ap-runtime-inputs').get().asFile
def apManifestFile = new File(apInputsDir, 'manifest.json')
if (!apManifestFile.isFile()) {
    throw new GradleException('Prepare exact AP dependencies with tools/ap-runtime/prepare_inputs.py first.')
}
def apManifest = new groovy.json.JsonSlurper().parse(apManifestFile)
def withDragonrise = providers.gradleProperty('dnvWithDragonrise').map { it == 'true' }.getOrElse(false)
def apArtifacts = apManifest.artifacts.findAll { withDragonrise || it.file != 'dragonrise-reforge-exact.jar' }
def m1RunDir = withDragonrise ? 'build/run-m1-indicator-dragonrise-gametest' : 'build/run-m1-indicator-gametest'
def apDigest = { File artifact ->
    java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
}
apArtifacts.each { item ->
    def artifact = new File(apInputsDir, item.file)
    if (!artifact.isFile() || apDigest(artifact) != item.sha256) {
        throw new GradleException("AP dependency identity mismatch: ${item.file}")
    }
}
def apMapping = file(apManifest.mapping.path)
if (!apMapping.isFile() || apDigest(apMapping) != apManifest.mapping.sha256) {
    throw new GradleException('AP development mapping identity mismatch')
}

sourceSets {
    apRuntimeTools {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    apRuntimeMain {
        java.setSrcDirs([])
        java.destinationDirectory = layout.buildDirectory.dir('classes/java/apRuntimeBase')
        resources.setSrcDirs(sourceSets.main.resources.srcDirs)
    }
    apRuntimeArtillery {
        java.setSrcDirs([])
        java.destinationDirectory = layout.buildDirectory.dir('classes/java/apRuntimeArtillery')
        resources.setSrcDirs(sourceSets.artillery.resources.srcDirs)
    }
    apRuntimePlatform {
        java.setSrcDirs([])
        java.destinationDirectory = layout.buildDirectory.dir('classes/java/apRuntimePlatform')
        resources.setSrcDirs(sourceSets.platform.resources.srcDirs)
    }
    apRuntimeBoss {
        java.setSrcDirs([])
        java.destinationDirectory = layout.buildDirectory.dir('classes/java/apRuntimeBoss')
        resources.setSrcDirs(sourceSets.boss.resources.srcDirs)
    }
    apRuntimeRouteCore {
        java.setSrcDirs([])
        java.destinationDirectory = layout.buildDirectory.dir('classes/java/apRuntimeRouteCore')
        resources.setSrcDirs([])
    }
    apStationGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath +
                sourceSets.platform.output + sourceSets.boss.output + sourceSets.artillery.output
    }
    apGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath = output + sourceSets.apRuntimeMain.output +
                sourceSets.apRuntimeArtillery.output +
                sourceSets.apRuntimePlatform.output + sourceSets.apRuntimeRouteCore.output +
                sourceSets.apRuntimeBoss.output +
                sourceSets.apStationGameTest.output +
                configurations.apGameTestRuntimeClasspath.filter {
                    it.name != 'superbwarfare-0.8.9.1-hotfix-993063bed.jar'
                }
    }
}

// Forge's naming service reads methods.csv/fields.csv from the system classpath.
// Inherit the standard Minecraft runtime (including its mapping ZIP), excluding
// only the raw SBW dependency replaced below by the exact development mapping.
configurations {
    apGameTestImplementation.extendsFrom implementation
    apGameTestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
    flatDir { dirs apInputsDir }
}

dependencies {
    apStationGameTestImplementation files(project(':route-core').sourceSets.main.output)
    apArtifacts.each { item ->
        if (item.remap) {
            apGameTestRuntimeOnly fg.deobf("dnv.ap:${item.file.replaceFirst(/\.jar$/, '')}:exact")
        } else {
            apGameTestRuntimeOnly files(new File(apInputsDir, item.file))
        }
    }
}

tasks.register('stageApRuntimeMain', JavaExec) {
    dependsOn tasks.named('classes'), tasks.named('apRuntimeToolsClasses')
    classpath = sourceSets.apRuntimeTools.runtimeClasspath
    mainClass = 'com.liucodex.doggiesnewvehicle.development.ApDevelopmentNameMapper'
    def mapping = file(apManifest.mapping.path)
    inputs.file mapping
    inputs.files sourceSets.main.output.classesDirs
    outputs.dir sourceSets.apRuntimeMain.java.destinationDirectory
    args sourceSets.main.java.destinationDirectory.get().asFile,
            sourceSets.apRuntimeMain.java.destinationDirectory.get().asFile, mapping
}

