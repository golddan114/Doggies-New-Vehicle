    dependsOn project(':route-core').tasks.named('classes')
    from project(':route-core').sourceSets.main.output.classesDirs
    into sourceSets.apRuntimeRouteCore.java.destinationDirectory
}

// Minecraft can swallow a loading exception and exit 0. Require this invocation's
// exact GameTests; neither Gradle's success message nor a zero-test server is proof.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        def report = file(m1RunDir + '/ap-tests.xml')
        def receipt = file(m1RunDir + '/ap-receipt.json')
        def started = 0L
        def before = [:]
        def runtimeInputs = {
            def files = new TreeSet<File>(Comparator.comparing { File item -> item.canonicalPath })
            files.addAll(fileTree('src').files)
            files.addAll(fileTree('gradle').files)
            files.addAll(fileTree('tools/ap-runtime').matching { exclude '**/__pycache__/**' }.files)
            files.addAll([file('build.gradle'), file('settings.gradle'), apManifestFile, apMapping,
                    file('build/createSrgToMcp/output.srg')])
            files.addAll(sourceSets.apGameTest.runtimeClasspath.files.findAll { it.isFile() })
            [sourceSets.apGameTest.output, sourceSets.apStationGameTest.output,
             sourceSets.apRuntimeMain.output, sourceSets.apRuntimeArtillery.output,
             sourceSets.apRuntimePlatform.output,
             sourceSets.apRuntimeRouteCore.output, sourceSets.apRuntimeBoss.output].each { output ->
                output.files.findAll { it.isDirectory() }.each { files.addAll(fileTree(it).files) }
            }
            files.collectEntries { [(it.canonicalPath): apDigest(it)] }
        }
        doFirst {
            started = System.currentTimeMillis()
            receipt.setText(groovy.json.JsonOutput.toJson([status: 'RUNNING', startedAtMillis: started]), 'UTF-8')
            before = runtimeInputs()
            file(m1RunDir + '/ap-inputs.json').setText(groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson([startedAtMillis: started, javaVersion: System.getProperty('java.runtime.version'),
                            gradleVersion: gradle.gradleVersion, files: before])), 'UTF-8')
        }
        doLast {
            if (!report.isFile() || report.lastModified() < started) {
                throw new GradleException('AP runtime produced no fresh XML; startup failure or zero tests is not PASS')
            }
            def xml = new groovy.util.XmlSlurper(false, false).parse(report)
            def cases = xml.depthFirst().findAll { it.name() == 'testcase' }
            def expected = [
                    'exactmodsandnativeprojectileareloaded',
                    'nativeserverqueueexecutesonce',
                    'nativeexplosionstilldamagesworld',
                    'savednativeshellkeepsmotionandexplosion',
                    'legacymarkerdoesnotrejectfactoryrestoration',
                    'legacymarkerdoesnotrejectdirectload',
                    'retiredac130idshavenodnvcrewcatalog',
                    'nativem1entityandgundataloadwithoutdch',
                    'nativeindicatorbindsandremovesm1withoutchangingitstype',
                    'nativeindicatorsettargetcreatestransientm1aim',
                    'unloadedm1bindingsurvivestargetupdate',
                    'stationcontentregistersduringthecorrectforgeevent',
                    'cubebossspawnswithvanillateamandpersistenthoveranchor',
                    'hoverroutestopswhenownerisnotonline',
                    'distantownercanstoploadedhoverroutebutstrangercannot',
                    'onlineownerrouteclimbsthenmovestowardwaypoint',
                    'ownerdescentreplacesrouteandstopsoversolidground',
                    'fixedlightgunskeepaiandplayerfireindependent'] as Set
            def names = cases.collect { it.@name.text() }
            if (names.size() != expected.size() || names.toSet() != expected ||
                    cases.any { it.@classname.text() != 'dnvapgametest:ap_arena' } ||
                    xml.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] }) {
                throw new GradleException("AP runtime assertions missing or failed: ${names}")
            }
            if (runtimeInputs() != before) throw new GradleException('AP runtime inputs changed during execution')
            receipt.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    status: 'PASS', evidence: 'REAL_SERVERLEVEL_EXACT_MODS_FRESH_XML',
                    tests: names.sort(), startedAtMillis: started, finishedAtMillis: System.currentTimeMillis(),
                    reportSha256: apDigest(report), inputsSha256: apDigest(file(m1RunDir + '/ap-inputs.json')),
                    limitation: 'NATIVE_WORLD_AND_NBT_REGRESSION_NOT_FULL_PLATFORM_OR_CLIENT_ACCEPTANCE'])), 'UTF-8')
            logger.lifecycle("AP runtime verified: ${names.size()} actual GameTests, fresh XML, unchanged inputs")
        }
}

