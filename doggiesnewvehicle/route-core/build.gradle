plugins {
    id 'java-library'
}

def minecraftLine = providers.gradleProperty('dnvMinecraft').getOrElse('1.20.1')
def requiredJava = minecraftLine == '1.21.1' ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
if (JavaVersion.current() != requiredJava) {
    throw new GradleException("DNV ${minecraftLine} route build requires Java ${requiredJava}; current JVM is ${JavaVersion.current()}.")
}
if (minecraftLine == '1.21.1') layout.buildDirectory = file('build/neoforge1211')

group = 'com.liucodex.doggiesnewvehicle'
version = '1.1.34'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
