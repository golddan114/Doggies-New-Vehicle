description='''
《卓越前线》的非官方附属模组，包含火炮、装甲载具、战略发射设施与大型战斗单位。
完整版本还提供自由号战列舰、岳级航空母舰、飞鹰型舰载机及两本中英玩法手册。

An unofficial Superb Warfare add-on with artillery, armored vehicles, strategic launch sites, and large combat units.
The full build includes the Libertad battleship, Yue-class aircraft carrier, Feiying carrier fighter, and two in-game player guides.

测试QQ群：815277094
'''

